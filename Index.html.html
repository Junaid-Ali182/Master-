<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Notebook - Inventory App</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-7xl mx-auto">
    <h1 class="text-3xl font-bold mb-4">Master Notebook - Inventory System</h1><div class="grid grid-cols-1 md:grid-cols-2 gap-6">
  <div class="bg-white p-4 shadow rounded">
    <h2 class="text-xl font-semibold mb-2">Add Product</h2>
    <form id="productForm" class="space-y-2">
      <input type="text" placeholder="Product Name" id="productName" class="w-full border p-2">
      <input type="text" placeholder="Category" id="productCategory" class="w-full border p-2">
      <input type="number" placeholder="Price" id="productPrice" class="w-full border p-2">
      <input type="number" placeholder="Stock" id="productStock" class="w-full border p-2">
      <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Add</button>
    </form>
  </div>

  <div class="bg-white p-4 shadow rounded">
    <h2 class="text-xl font-semibold mb-2">Sales & Purchases</h2>
    <form id="transactionForm" class="space-y-2">
      <input type="text" placeholder="Customer Name" id="customerName" class="w-full border p-2">
      <input type="text" placeholder="Phone Number" id="customerPhone" class="w-full border p-2">
      <input type="text" placeholder="Product Name" id="transProduct" class="w-full border p-2">
      <input type="number" placeholder="Quantity" id="transQty" class="w-full border p-2">
      <select id="transType" class="w-full border p-2">
        <option value="sale">Sale</option>
        <option value="purchase">Purchase</option>
        <option value="loan">Loan</option>
        <option value="credit">Credit</option>
      </select>
      <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded">Record</button>
    </form>
  </div>
</div>

<div class="bg-white p-4 shadow rounded mt-6">
  <h2 class="text-xl font-semibold mb-2">Report</h2>
  <button onclick="printReport()" class="bg-indigo-600 text-white px-4 py-2 mb-4 rounded">Print Report</button>
  <div id="reportSection">
    <table class="table-auto w-full border">
      <thead>
        <tr class="bg-gray-200">
          <th class="px-4 py-2">Date</th>
          <th class="px-4 py-2">Type</th>
          <th class="px-4 py-2">Customer</th>
          <th class="px-4 py-2">Phone</th>
          <th class="px-4 py-2">Product</th>
          <th class="px-4 py-2">Qty</th>
        </tr>
      </thead>
      <tbody id="reportTable"></tbody>
    </table>
  </div>
</div>

  </div>  <script>
    const productForm = document.getElementById('productForm');
    const transactionForm = document.getElementById('transactionForm');
    const reportTable = document.getElementById('reportTable');

    const transactions = [];

    transactionForm.onsubmit = e => {
      e.preventDefault();
      const date = new Date().toLocaleString();
      const type = document.getElementById('transType').value;
      const customer = document.getElementById('customerName').value;
      const phone = document.getElementById('customerPhone').value;
      const product = document.getElementById('transProduct').value;
      const qty = document.getElementById('transQty').value;
      transactions.push({ date, type, customer, phone, product, qty });
      renderReport();
    };

    function renderReport() {
      reportTable.innerHTML = '';
      transactions.forEach(t => {
        reportTable.innerHTML += `<tr>
          <td class="border px-4 py-2">${t.date}</td>
          <td class="border px-4 py-2">${t.type}</td>
          <td class="border px-4 py-2">${t.customer}</td>
          <td class="border px-4 py-2">${t.phone}</td>
          <td class="border px-4 py-2">${t.product}</td>
          <td class="border px-4 py-2">${t.qty}</td>
        </tr>`;
      });
    }

    function printReport() {
      html2canvas(document.getElementById("reportSection")).then(canvas => {
        const win = window.open();
        win.document.write('<img src="' + canvas.toDataURL() + '"/>' );
        win.print();
        win.close();
      });
    }
  </script></body>
</html>
